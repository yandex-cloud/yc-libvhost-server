name: CI
on: [push, pull_request]

jobs:
  build-and-run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Install libraries
        run: |
          sudo apt update
          sudo apt install python3 python3-docutils meson clang libaio-dev libcunit1-dev rustc cargo
          python3 -m pip install pytest
          rustup default 1.89.0
          rustup component add clippy

      - name: Build
        run: |
          src_dir="${{ github.workspace }}"
          build_dir="$src_dir/build"
          CC=clang CXX=clang++ meson setup $build_dir $src_dir -Dunit-tests=enabled
          pushd $build_dir
          ninja
          popd

      - name: Run unit tests
        run: meson test -C build --suite unit --print-errorlogs --logbase unit-tests

      - name: Print full unit test log
        if: failure()
        run: |
          if [ -f build/meson-logs/unit-tests.txt ]; then
            cat build/meson-logs/unit-tests.txt
          fi

      - name: Run integration tests
        run: |
          python3 -m pytest ${{ github.workspace }}/tests/test_libvhost.py -s -v --junitxml build/meson-logs/integration-tests.junit.xml

      - name: Collect test results
        uses: mikepenz/action-junit-report@v3
        if: always()
        with:
          report_paths: build/meson-logs/*.junit.xml
  build-with-cmake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Install libraries
        run: |
          sudo apt update
          sudo apt install cmake ninja-build clang

      - name: Build
        run: |
          src_dir="${{ github.workspace }}"
          build_dir="$src_dir/build"
          cmake -S $src_dir -B $build_dir -G Ninja -DCMAKE_C_COMPILER=clang
          ninja -C $build_dir
  lint-python-scripts:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3

      - name: Install flake8 & mypy
        run: |
          sudo apt update
          sudo apt install python3 python3-pip
          pip install flake8 mypy pytest

      - name: Run flake8
        run: flake8 tests/*.py

      - name: Run mypy
        run: mypy --disallow-incomplete-defs --no-implicit-optional tests/*.py
